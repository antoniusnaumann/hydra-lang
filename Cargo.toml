[package]
name = "hydra-lang"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of the Hydra language: interpreter, check and formatter"
default-run = "hydra"

# Protocol and format implementations shared by the standard modules.
[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[lib]
name = "hydra"
path = "src/lib.rs"

[[bin]]
name = "hydra"
path = "src/main.rs"

[profile.release]
panic = "abort"
