name: Tests and reference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test interpreter and standard modules
        run: cargo test --locked
      - name: Check generated reference and examples
        run: python3 docs/build.py --check
      - name: Check highlighting adapter
        run: python3 -m unittest discover -s docs -p 'test_*.py'
